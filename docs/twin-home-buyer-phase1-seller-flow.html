<style>
  :root{--bg:#EDF0F4;--surface:#FFFFFF;--border:#D6DDE6;--text:#111823;--dim:#4A5566;
    --faint:#7E8896;--accent:#1F6FB2;--sans:"Archivo",ui-sans-serif,system-ui,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,monospace}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D1218;--surface:#151C25;
    --border:#2A3340;--text:#E3E9F1;--dim:#9AA5B4;--faint:#6D7887;--accent:#5FA9E2}}
  :root[data-theme="dark"]{--bg:#0D1218;--surface:#151C25;--border:#2A3340;--text:#E3E9F1;
    --dim:#9AA5B4;--faint:#6D7887;--accent:#5FA9E2}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans)}
  header{display:flex;flex-wrap:wrap;gap:14px 26px;align-items:baseline;padding:18px 24px;
    background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5}
  h1{font-size:19px;font-weight:700;margin:0;letter-spacing:-.01em}
  h1 span{color:var(--accent);font-family:var(--mono)}
  .meta{display:flex;gap:22px;flex-wrap:wrap;margin-right:auto}
  .m{font-size:12px;color:var(--dim)}
  .m b{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--faint);font-weight:600}
  .zoom{display:flex;gap:6px;align-items:center}
  button{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--text);background:var(--bg);
    border:1px solid var(--border);padding:6px 11px;border-radius:3px;cursor:pointer}
  button:hover{border-color:var(--accent);color:var(--accent)}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .hint{font-size:12px;color:var(--faint);font-family:var(--mono)}
  .stage{overflow:auto;padding:22px;height:calc(100vh - 66px)}
  .sheet{background:#FFFFFF;border:1px solid var(--border);box-shadow:0 1px 3px rgba(0,0,0,.14);
    width:max-content;margin:0 auto}
  .sheet svg{display:block;width:var(--w,1600px);height:auto}
  @media (max-width:700px){.stage{padding:10px}header{padding:14px 16px}}
</style>

</header>

id="solid-1F6FB2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F6FB2"/></marker><marker id="open-1F6FB2" viewBox="0 0 11 11" refX="10" refY="5.5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1,1 L10,5.5 L1,10" fill="none" stroke="#1F6FB2" stroke-width="2"/></marker><marker id="solid-63459C" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#63459C"/></marker><marker id="open-63459C" viewBox="0 0 11 11" refX="10" refY="5.5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1,1 L10,5.5 L1,10" fill="none" stroke="#63459C" stroke-width="2"/></marker></defs><rect x="0" y="0" width="3400" height="4300" fill="#FFFFFF"/><rect x="120" y="60" width="540" height="420" rx="6" fill="#FFFFFF" stroke="#111823" stroke-width="3"/><rect x="120" y="60" width="540" height="8" fill="#1F6FB2"/><text x="148" y="124" text-anchor="start" font-family="'IBM Plex Mono', ui-monospace, 'Courier New', monospace" font-size="21" font-weight="700" fill="#1F6FB2">TWIN HOME BUYER</text><text x="148" y="178" text-anchor="start" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#111823">Phase 1 Seller</text><text x="148" y="220" text-anchor="start" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#111823">Inbound Call Flow</text><line x1="148" y1="252" x2="632" y2="252" stroke="#D6DDE6" stroke-width="2"/><text x="148" y="288" text-anchor="start" font-family="'IBM Plex Mono', ui-monospace, 'Courier New', monospace" font-size="15" font-weight="700" fill="#7E8896">SCOPE</text><text x="148" y="312" text-anchor="start" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#111823">New Seller + Seller Callback only</text><text x="148" y="336" text-anchor="start" font-family="'IBM Plex Mono', ui-monospace, 'Courier New', monospace" font-size="15" font-weight="700" fill="#7E8896">STATUS</text><text x="148" y="360" text-anchor="start" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#111823">For Cherry's review — not yet approved</text><text x="148" y="384" text-anchor="start" font-family="'IBM Plex Mono', ui-monospace, 'Courier New', monospace" font-size="15" font-weight="700" fill="#7E8896">BUILD / RETELL</text><text x="148" y="408" text-anchor="start" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#111823">Rosanes</text><text x="148" y="432" text-anchor="start" font-family="'IBM Plex Mono', ui-monospace, 'Courier New', monospace" font-size="15" font-weight="700" fill="#7E8896">APPROVAL</text><text x="148" y="456" text-anchor="start" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#111823">Cherry first, then Juan</text><rect x="700" y="60" width="1140" height="200" rx="3" fill="#EAF2F9" stroke="#1F6FB2" stroke-width="2" stroke-dasharray="9 5"/><text x="1270" y="125" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, 'Courier New', monospace" font-size="16" font-weight="700" fill="#1F6FB2">PHASE 1 SCOPE</text><text x="1270" y="152" text-anchor="middle" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#111823">Build and approve these two caller types first. Do NOT build the Realtor, legal, plumbing, buyer, vendor, applicant or</text><text x="1270" y="179" text-anchor="middle" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#111823">other branches yet — they are later phases. The goal is to get this seller flow approved before the rest of the Retell</text><text x="1270" y="206" text-anchor="middle" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#111823">system is built.</text><rect x="700" y="280" width="1140" height="200" rx="3" fill="#FDF7EA" stroke="#A8730A" stroke-width="2" stroke-dasharray="9 5"/><text x="1270" y="359" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, 'Courier New', monospace" font-size="16" font-weight="700" fill="#A8730A">TIMING PRINCIPLE</text><text x="1270" y="386" text-anchor="middle" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#111823">The Google Chat availability check runs at the same time as the AI conversation. Never build it as: notify → wait 30</text><text x="1270" y="413" text-anchor="middle" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#111823">seconds → check → continue. There must be no point where the caller hears silence waiting for Juan or Cherry.</text><rect x="1900" y="60" width="1380" height="420" rx="6" fill="#FCF1EF" stroke="#A93529" stroke-width="3"/><text x="1930" y="106" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#A93529">A CLAIM DOES NOT INTERRUPT THE CALL</text><text x="1930" y="140" font-family="'IBM Plex Mono', ui-monospace, 'Courier New', monospace" font-size="19" fill="#A93529">mandatory — this is the rule most likely to be built wrong</text><text x="1930" y="168" text-anchor="start" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#111823">If Juan or Cherry sends TRANSFER while the seller is talking, the AI must NOT transfer yet.</text><text x="1948" y="212" font-family="'IBM Plex Mono', ui-monospace, 'Courier New', monospace" font-size="20" font-weight="700" fill="#A93529">✗</text><text x="1982" y="212" text-anchor="start" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="500" fill="#111823">Cut off the seller</text><text x="1948" y="246" font-family="'IBM Plex Mono', ui-monospace, 'Courier New', monospace" font-size="20" font-weight="700" fill="#A93529">✗</text><text x="1982" y="246" text-anchor="start" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="500" fill="#111823">Interrupt mid-sentence</text><text x="1948" y="280" font-family="'IBM Plex Mono', ui-monospace, 'Courier New', monospace" font-size="20" font-weight="700" fill="#A93529">✗</text><text x="1982" y="280" text-anchor="start" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="500" fill="#111823">Suddenly announce a transfer</text><text x="1948" y="314" font-family="'IBM Plex Mono', ui-monospace, 'Courier New', monospace" font-size="20" font-weight="700" fill="#A93529">✗</text><text x="1982" y="314" text-anchor="start" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="500" fill="#111823">Abandon the question being answered</text><text x="1948" y="348" font-family="'IBM Plex Mono', ui-monospace, 'Courier New', monospace" font-size="20" font-weight="700" fill="#A93529">✗</text><text x="1982" y="348" text-anchor="start" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="500" fill="#111823">Skip required information because somebody claimed</text><rect x="2560" y="196" width="690" height="176" rx="4" fill="#FFFFFF" stroke="#A93529" stroke-width="2"/><text x="2584" y="232" text-anchor="start" font-family="'IBM Plex Mono', ui-monospace, 'Courier New', monospace" font-size="20" font-weight="700" fill="#A93529">CLAIM  =  PENDING TRANSFER</text><text x="2584" y="266" text-anchor="start" font-family="'IBM Plex Mono', ui-monospace, 'Courier New', monospace" font-size="17" font-weight="500" fill="#4A5566">transfer_claim_status = ue', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#111823">Transfer Call</text><rect x="1350" y="600" width="56" height="38" rx="3" fill="#A8730A" stroke="#7C5407" stroke-width="2"/><text x="1418" y="624" text-anchor="start" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#111823">Function / Notify</text><rect x="1650" y="600" width="56" height="38" rx="3" fill="#A93529" stroke="#7E271D" stroke-width="2"/><text x="1718" y="624" text-anchor="start" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#111823">Critical Rule</text><rect x="1950" y="600" width="56" height="38" rx="19" fill="#EEF2F6" stroke="#16785A" stroke-width="3"/><text x="2018" y="624" text-anchor="start" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#111823">Ending</text><line x1="2200" y1="608" x2="2320" y2="608" stroke="#16785A" stroke-width="4" marker-end="url(#solid-16785A)"/><text x="2336" y="615" text-anchor="start" font-family="'IBM Plex Mono', ui-monospace, 'Courier New', monospace" font-size="18" font-weight="600" fill="#16785A">SOLID = live call moves (transfer)</text><line x1="2200" y1="646" x2="2320" y2="646" stroke="#A8730A" stroke-width="4" stroke-dasharray="12 7" marker-end="url(#open-A8730A)"/><text x="2336" y="653" text-anchor="start" font-family="'IBM Plex Mono', ui-monospace, 'Courier New', monospace" font-size="18" font-weight="600" fill="#A8730A">DASHED = notification only, no transfer</text><rect x="700" y="720" width="420" height="46" rx="3" fill="#1F6FB2"/><text x="718" y="752" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF" letter-spacing="1.5">INCOMING CALL</text><rect x="700" y="786" width="420" height="110" rx="4" fill="#1F6FB2" stroke="#17578C" stroke-width="2"/><text x="910" y="817" text-anchor="midd <script>
  const sheet=document.getElementById('sheet'),stage=document.getElementById('stage'),NAT=3400;
  let w=1600;
  const apply=()=>sheet.style.setProperty('--w',w+'px');
  const fit=()=>{w=Math.max(320,stage.clientWidth-46);apply();};
  document.querySelectorAll('[data-z]').forEach(b=>b.addEventListener('click',()=>{
    const z=b.dataset.z;
    if(z==='in')w=Math.min(NAT*2,w*1.25);
    if(z==='out')w=Math.max(320,w/1.25);
    if(z==='full')w=NAT;
    if(z==='fit')return fit();
    apply();}));
  fit();
  addEventListener('resize',()=>{if(w>stage.clientWidth)fit();});
</script>
